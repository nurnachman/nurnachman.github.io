<!DOCTYPE html><html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מקלדת עברית מותאמת</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    margin: 0;
    height: 100vh;
    font-family: sans-serif;
    background: #f0f0f0;
  }
  textarea {
    width: 90%;
    height: 50vh;
    margin: 1em auto 0 auto;
    font-size: 1.2em;
    direction: rtl;
    resize: none;
    display: block;
  }
  .keyboard {
    width: 100%;
    height: 30vh;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 5px;
    box-sizing: border-box;
    position: fixed;
    bottom: 0;
    left: 0;
    background: #f0f0f0;
  }
  .row {
    display: flex;
    justify-content: space-evenly;
    margin: 4px 0;
    flex: 1;
  }
  button {
    flex: 1;
    margin: 0 4px;
    font-size: 1.4em;
    border: 1px solid #ccc;
    background: white;
    border-radius: 8px;
    height: 100%;
  }
  button:active {
    background: #ddd;
  }
</style>
</head>
<body><textarea id="output" placeholder="אדם בלילה שקט זמר כתב סיפור חכם ונעים על מקלדת יפה וצנועה בגזע עתיק" autofocus></textarea><div class="keyboard">
  <div class="row">
    <button disabled>Shift</button>
    <button>ח</button>
    <button>ד</button>
    <button>ע</button>
    <button>פ</button>
    <button>ג</button>
    <button onclick="backspace()">⌫</button>
  </div>
  <div class="row">
    <button disabled>🌐</button>
    <button>מ</button>
    <button>ה</button>
    <button>ת</button>
    <button>ב</button>
    <button>צ</button>
    <button onclick="backspace()">⌫</button>
  </div>
  <div class="row">
    <button onclick="insert(' ')">⎵</button>
    <button>ל</button>
    <button>ו</button>
    <button>י</button>
    <button>א</button>
    <button>ר</button>
    <button onclick="insert(' ')">⎵</button>
  </div>
  <div class="row">
    <button onclick="insert(' ')">⎵</button>
    <button>ט</button>
    <button>כ</button>
    <button>ק</button>
    <button>נ</button>
    <button>ש</button>
    <button onclick="insert(' ')">⎵</button>
  </div>
  <div class="row">
    <button onclick="insert('123')">123</button>
    <button>,</button>
    <button>?</button>
    <button>ס</button>
    <button>ז</button>
    <button>.</button>
    <button onclick="insert('\n')">⏎</button>
  </div>
</div><script>
const textarea = document.getElementById('output');
let lastChar = '';
let currentWord = [];
let sentenceTravelSum = 0;

const keyPositions = {
  'ח': [0, 1], 'ד': [0, 2], 'ע': [0, 3], 'פ': [0, 4], 'ג': [0, 5],
  'מ': [1, 1], 'ה': [1, 2], 'ת': [1, 3], 'ב': [1, 4], 'צ': [1, 5],
  'ל': [2, 1], 'ו': [2, 2], 'י': [2, 3], 'א': [2, 4], 'ר': [2, 5],
  'ט': [3, 1], 'כ': [3, 2], 'ק': [3, 3], 'נ': [3, 4], 'ש': [3, 5],
  'ס': [4, 3], 'ז': [4, 4]
};

const finalForms = {
  'פ': 'ף',
  'כ': 'ך',
  'מ': 'ם',
  'נ': 'ן',
  'צ': 'ץ'
};

function manhattanDistance(pos1, pos2) {
  return Math.abs(pos1[0] - pos2[0]) + Math.abs(pos1[1] - pos2[1]);
}

function calculateTravelDistance(word) {
  let distance = 0;
  for (let i = 1; i < word.length; i++) {
    const prev = keyPositions[word[i - 1]];
    const curr = keyPositions[word[i]];
    if (prev && curr) {
      distance += manhattanDistance(prev, curr);
    }
  }
  return distance;
}

function insert(char) {
  if (char === '123') {
    return;
  }

  if (char === ' ') {
    if (currentWord.length > 1) {
      const distance = calculateTravelDistance(currentWord);
      textarea.value += `[${distance}]`;
      sentenceTravelSum += distance;
    }
    textarea.value += char;
    currentWord = [];
    lastChar = '';
    return;
  }

  if (['.', ','].includes(char) && finalForms[lastChar]) {
    textarea.value = textarea.value.slice(0, -1) + finalForms[lastChar] + char;
    lastChar = '';
    currentWord = [];
  } else if (char === '\n') {
    if (currentWord.length > 1) {
      const distance = calculateTravelDistance(currentWord);
      sentenceTravelSum += distance;
    }
    textarea.value += `\n{${sentenceTravelSum}}`;
    sentenceTravelSum = 0;
    currentWord = [];
    lastChar = '';
  } else {
    textarea.value += char;
    lastChar = char;
    currentWord.push(char);
  }
}

function backspace() {
  textarea.value = textarea.value.slice(0, -1);
  if (currentWord.length > 0) {
    currentWord.pop();
  }
}

const buttons = document.querySelectorAll('button');
buttons.forEach(button => {
  if (!button.disabled && button.innerText.length === 1) {
    button.addEventListener('click', () => insert(button.innerText));
  }
});
</script></body>
</html>

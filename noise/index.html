<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noise Logger</title>
  <style>
    body { font-family: sans-serif; margin:0; padding:20px; background:#eee; }
    .container { max-width:800px; margin:auto; background:white; padding:20px; border-radius:10px; }
    .controls { display:flex; gap:10px; justify-content:center; margin:20px 0; }
    button { padding:10px 20px; border:none; border-radius:5px; cursor:pointer; }
    .start-btn { background:green; color:white; }
    .stop-btn { background:red; color:white; }
    .export-btn { background:blue; color:white; }
    .disabled { opacity:0.5; cursor:not-allowed; }
    .status { margin:10px 0; font-weight:bold; }
    canvas { width:100%; height:200px; border:1px solid #ccc; margin:10px 0; }
    .clips-list { list-style:none; padding:0; }
    .clip-item { display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #ddd; }
    .empty-message { text-align:center; color:#666; padding:20px; font-style:italic; }
    @media (max-width:768px){
      .controls { flex-direction:column; align-items:center; }
      button { width:200px; }
      .clip-item { flex-direction:column; align-items:flex-start; gap:10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎤 Noise Logger</h1>
    <div class="controls">
      <button id="startBtn" class="start-btn">Start</button>
      <button id="stopBtn" class="stop-btn disabled">Stop</button>
      <button id="exportBtn" class="export-btn">Download CSV</button>
    </div>
    <div id="status" class="status">Status: Stopped</div>
    <canvas id="oscilloscope"></canvas>
    <h3>Clips (<span id="clipCount">0</span>)</h3>
    <ul id="clipsList" class="clips-list">
      <li class="empty-message">No recordings yet</li>
    </ul>
  </div>

  <script>
  class NoiseLogger {
    constructor() {
      this.isRecording = false;
      this.audioContext = null;
      this.mediaStream = null;
      this.sourceNode = null;
      this.processorNode = null;
      this.analyzer = null;
      this.zeroGain = null;

      this.threshold = 0.2;
      this.bufferDuration = 3;
      this.sampleRate = 44100;
      this.audioBuffer = [];
      this.maxBufferSize = this.bufferDuration * this.sampleRate;
      this.clips = [];

      this.startBtn = document.getElementById('startBtn');
      this.stopBtn = document.getElementById('stopBtn');
      this.exportBtn = document.getElementById('exportBtn');
      this.status = document.getElementById('status');
      this.clipsList = document.getElementById('clipsList');
      this.clipCount = document.getElementById('clipCount');
      this.canvas = document.getElementById('oscilloscope');
      this.canvasCtx = this.canvas.getContext('2d');

      this.bindEvents();
      this.initCanvas();
    }

    bindEvents() {
      this.startBtn.onclick = () => this.startRecording();
      this.stopBtn.onclick = () => this.stopRecording();
      this.exportBtn.onclick = () => this.exportCSV();
      window.onresize = () => this.initCanvas();
    }

    initCanvas() {
      this.canvas.width = this.canvas.offsetWidth;
      this.canvas.height = this.canvas.offsetHeight;
      this.canvasCtx.fillStyle = '#000';
      this.canvasCtx.fillRect(0,0,this.canvas.width,this.canvas.height);
    }

    async startRecording() {
      const isLocalhost = ['localhost','127.0.0.1','::1'].includes(location.hostname);
      if (!window.isSecureContext && !isLocalhost) {
        alert('Microphone access requires HTTPS or localhost');
        return;
      }
      if (!navigator.mediaDevices?.getUserMedia) {
        alert('getUserMedia not available in this browser');
        return;
      }

      try {
        // Try strict, then fallback
        try {
          this.mediaStream = await navigator.mediaDevices.getUserMedia({
            audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
          });
        } catch (e1) {
          console.warn('strict failed', e1);
          this.mediaStream = await navigator.mediaDevices.getUserMedia({ audio:true });
        }

        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { alert('Web Audio API not supported'); return; }
        this.audioContext = new AC();
        if (this.audioContext.state === 'suspended') await this.audioContext.resume();

        this.sourceNode = this.audioContext.createMediaStreamSource(this.mediaStream);
        this.analyzer = this.audioContext.createAnalyser();
        this.analyzer.fftSize = 2048;

        this.processorNode = this.audioContext.createScriptProcessor(2048,1,1);
        this.processorNode.onaudioprocess = (e)=>this.processAudio(e);

        this.zeroGain = this.audioContext.createGain();
        this.zeroGain.gain.value = 0;

        this.sourceNode.connect(this.analyzer);
        this.sourceNode.connect(this.processorNode);
        this.processorNode.connect(this.zeroGain);
        this.zeroGain.connect(this.audioContext.destination);

        this.isRecording = true;
        this.updateUI();
        this.visualize();

      } catch(err) {
        alert(`Failed to start recording:\n${err.name}: ${err.message}`);
        console.error(err);
      }
    }

    processAudio(e) {
      const input = e.inputBuffer.getChannelData(0);
      let peak=0;
      for (let i=0;i<input.length;i++) {
        if (Math.abs(input[i])>peak) peak=Math.abs(input[i]);
        this.audioBuffer.push(input[i]);
        if (this.audioBuffer.length > this.maxBufferSize) this.audioBuffer.shift();
      }
      if (peak>this.threshold) {
        console.log('Peak detected', peak.toFixed(2));
      }
    }

    visualize() {
      if (!this.isRecording) return;
      const data = new Uint8Array(this.analyzer.frequencyBinCount);
      this.analyzer.getByteTimeDomainData(data);
      this.canvasCtx.fillStyle='#000';
      this.canvasCtx.fillRect(0,0,this.canvas.width,this.canvas.height);
      this.canvasCtx.beginPath();
      this.canvasCtx.strokeStyle='#0f0';
      const slice = this.canvas.width/data.length;
      let x=0;
      for (let i=0;i<data.length;i++){
        const v=data[i]/128.0;
        const y=v*this.canvas.height/2;
        if(i===0) this.canvasCtx.moveTo(x,y);
        else this.canvasCtx.lineTo(x,y);
        x+=slice;
      }
      this.canvasCtx.stroke();
      requestAnimationFrame(()=>this.visualize());
    }

    stopRecording() {
      this.isRecording=false;
      if(this.mediaStream) this.mediaStream.getTracks().forEach(t=>t.stop());
      if(this.audioContext) this.audioContext.close();
      this.updateUI();
    }

    updateUI() {
      if(this.isRecording){
        this.startBtn.classList.add('disabled');
        this.stopBtn.classList.remove('disabled');
        this.status.textContent='Status: Recording...';
      } else {
        this.startBtn.classList.remove('disabled');
        this.stopBtn.classList.add('disabled');
        this.status.textContent='Status: Stopped';
      }
      this.clipCount.textContent=this.clips.length;
    }

    exportCSV(){
      if(this.clips.length===0){ alert('No clips'); return; }
      const csv='Timestamp,Peak\n'+this.clips.map(c=>`${c.timestamp},${c.peak}`).join('\n');
      const blob=new Blob([csv],{type:'text/csv'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download='noise_log.csv';a.click();
      URL.revokeObjectURL(url);
    }
  }
  window.onload=()=>new NoiseLogger();
  </script>
</body>
</html>

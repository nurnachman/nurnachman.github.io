<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Noise Logger</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    button { margin: 5px; padding: 10px; }
    canvas { border: 1px solid #ccc; width: 100%; height: 100px; }
    #log { margin-top: 20px; }
  </style>
</head>
<body>
  <button id="startBtn">Start</button>
  <button id="stopBtn" disabled>Stop</button>
  <button id="downloadCsvBtn">Download CSV</button>
  <canvas id="visual"></canvas>
  <h3>Clips</h3>
  <ul id="log"></ul>

<script>
let audioCtx, analyser, processor, source;
let mediaStream;
let buffer = [];
let preSeconds = 3;
let postSeconds = 3;
let triggered = false;
let drawId;
let logs = JSON.parse(localStorage.getItem("noiseLogs") || "[]");

const canvas = document.getElementById("visual");
const ctx = canvas.getContext("2d");
const logList = document.getElementById("log");

function renderLogs() {
  logList.innerHTML = "";
  logs.forEach(item => {
    let li = document.createElement("li");
    let a = document.createElement("a");
    a.href = item.url;
    a.download = item.filename;
    a.textContent = `${item.timestamp} (peak=${item.peak.toFixed(3)})`;
    li.appendChild(a);
    logList.appendChild(li);
  });
}
renderLogs();

document.getElementById("startBtn").onclick = async () => {
  mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioCtx = new AudioContext();
  source = audioCtx.createMediaStreamSource(mediaStream);
  analyser = audioCtx.createAnalyser();
  processor = audioCtx.createScriptProcessor(1024, 1, 1);

  source.connect(analyser);
  analyser.connect(processor);
  processor.connect(audioCtx.destination);

  processor.onaudioprocess = (e) => {
    let input = e.inputBuffer.getChannelData(0);
    let peak = Math.max(...input.map(v => Math.abs(v)));
    buffer.push(...input);

    let maxLen = audioCtx.sampleRate * (preSeconds + postSeconds);
    if (buffer.length > maxLen) buffer.splice(0, buffer.length - maxLen);

    if (!triggered && peak > 0.2) {
      triggered = true;
      let ts = new Date().toISOString();
      let pre = buffer.slice(-audioCtx.sampleRate * preSeconds);
      let maxPeak = peak;

      setTimeout(() => {
        let clip = pre.concat(buffer.slice(-audioCtx.sampleRate * postSeconds));
        saveWav(clip, ts, maxPeak);
        triggered = false;
      }, postSeconds * 1000);
    }
  };

  drawWave();
  document.getElementById("startBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;
};

document.getElementById("stopBtn").onclick = () => {
  if (processor) processor.disconnect();
  if (analyser) analyser.disconnect();
  if (source) source.disconnect();
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
  cancelAnimationFrame(drawId);
  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
};

document.getElementById("downloadCsvBtn").onclick = () => {
  let csv = "timestamp,filename,peak\n" + logs.map(l => 
    `${l.timestamp},${l.filename},${l.peak}`).join("\n");
  let blob = new Blob([csv], { type: "text/csv" });
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href = url;
  a.download = "noise_log.csv";
  a.click();
};

function drawWave() {
  let dataArray = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(dataArray);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.beginPath();
  let sliceWidth = canvas.width / dataArray.length;
  let x = 0;
  for (let i=0; i<dataArray.length; i++) {
    let v = dataArray[i] / 128.0;
    let y = v * canvas.height/2;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    x += sliceWidth;
  }
  ctx.lineWidth = 2;
  ctx.strokeStyle = "green";
  ctx.stroke();
  drawId = requestAnimationFrame(drawWave);
}

function saveWav(samples, ts, peak) {
  let buffer = new ArrayBuffer(44 + samples.length * 2);
  let view = new DataView(buffer);
  let writeStr = (o,s) => { for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };

  writeStr(0,"RIFF");
  view.setUint32(4, 36 + samples.length*2, true);
  writeStr(8,"WAVEfmt ");
  view.setUint32(16,16,true);
  view.setUint16(20,1,true);
  view.setUint16(22,1,true);
  view.setUint32(24,44100,true);
  view.setUint32(28,44100*2,true);
  view.setUint16(32,2,true);
  view.setUint16(34,16,true);
  writeStr(36,"data");
  view.setUint32(40,samples.length*2,true);

  let offset=44;
  for (let i=0; i<samples.length; i++, offset+=2) {
    let s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }

  let blob = new Blob([view], { type: "audio/wav" });
  let url = URL.createObjectURL(blob);
  let filename = `clip_${ts}.wav`;

  let entry = { timestamp: ts, filename, peak, url };
  logs.push(entry);
  localStorage.setItem("noiseLogs", JSON.stringify(logs));
  renderLogs();
}
</script>
</body>
</html>

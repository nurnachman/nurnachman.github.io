<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Noise Logger – Segment Recorder (No Threshold)</title>
<style>
  :root{--bg:#eee;--fg:#111;--card:#fff;--ok:#2e7d32;--err:#c62828;--accent:#3949ab}
  body{margin:0;padding:18px;font-family:system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--fg)}
  .container{max-width:980px;margin:auto;background:var(--card);border-radius:12px;padding:18px}
  h1{margin:0 0 10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .controls{justify-content:center;margin:10px 0 16px}
  button{padding:10px 18px;border:0;border-radius:8px;color:#fff;cursor:pointer}
  .start{background:var(--ok)} .stop{background:var(--err)} .btn{background:var(--accent)}
  .disabled{opacity:.5;cursor:not-allowed}
  label{display:inline-flex;align-items:center;gap:6px}
  input[type="number"]{width:86px;padding:6px;border-radius:6px;border:1px solid #ccc}
  .status{font-weight:700;margin:6px 0}
  canvas{width:100%;border:1px solid #ddd;border-radius:8px;background:#000}
  #scope{height:160px;margin:10px 0}
  .clips{list-style:none;padding:0;margin:8px 0;border:1px solid #e6e6e6;border-radius:8px}
  .clip{padding:10px 12px;border-bottom:1px solid #eee;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
  .clip:last-child{border-bottom:0}
  .meta{font-size:13px;opacity:.85}
  .thumb{width:100%;height:60px;border:1px solid #ddd;border-radius:6px;background:#000}
  .right{display:flex;gap:8px;align-items:center}
  audio{width:220px;height:28px}
  .empty{padding:24px;text-align:center;color:#777}
  .subtle{opacity:.8}
  @media (max-width:768px){
    .clip{grid-template-columns:1fr}
    audio{width:100%}
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎤 Noise Logger – Continuous Segments</h1>

  <div class="row controls">
    <button id="startBtn" class="start">Start</button>
    <button id="stopBtn" class="stop disabled">Stop</button>
    <button id="exportCsvBtn" class="btn">Export CSV</button>
    <button id="clearAllBtn" class="stop">Clear All</button>
  </div>

  <div class="row subtle">
    <div class="status" id="status">Status: Stopped</div>
    <div id="diag"></div>
    <label>Segment (sec):
      <input id="segLen" type="number" min="30" max="300" step="10" value="60"/>
    </label>
    <label>Buckets/segment:
      <input id="buckets" type="number" min="200" max="2000" step="100" value="600"/>
    </label>
  </div>

  <!-- live short oscilloscope -->
  <canvas id="scope"></canvas>

  <div class="row" style="justify-content:space-between;margin-top:8px">
    <strong>Clips</strong>
    <small class="subtle">Each row: preview waveform + player</small>
  </div>
  <ul id="clips" class="clips"><li class="empty">No clips yet</li></ul>
</div>

<script>
/* ===== IndexedDB tiny helper ===== */
const DB_NAME='noise-logger-seg'; const DB_VER=1;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('clips')) {
        const os = db.createObjectStore('clips', { keyPath:'id', autoIncrement:true });
        os.createIndex('ts','ts');
      }
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror =()=>reject(req.error);
  });
}
async function dbAddClip(row){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('clips','readwrite'); const os=tx.objectStore('clips');
    const req=os.add(row);
    req.onsuccess=()=>res(req.result);
    req.onerror =()=>rej(req.error);
  });
}
async function dbGetClips(){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('clips','readonly'); const os=tx.objectStore('clips');
    const idx=os.index('ts'); const req=idx.getAll();
    req.onsuccess=()=>res(req.result.sort((a,b)=>b.ts-a.ts));
    req.onerror =()=>rej(req.error);
  });
}
async function dbClearAll(){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction('clips','readwrite'); const os=tx.objectStore('clips');
    const req=os.clear(); req.onsuccess=res; req.onerror=()=>rej(req.error);
  });
}

/* ===== App ===== */
class SegmentRecorder {
  constructor(){
    // config
    this.segmentSec   = 60;   // can be changed by UI
    this.bucketsPerSeg= 600;  // preview resolution per segment

    // audio pipeline
    this.stream=null; this.recorder=null; this.recChunks=[];
    this.ac=null; this.source=null; this.analyser=null; this.proc=null; this.mute=null;
    this.sampleRate=44100;

    // preview builder (min/max per bucket for current segment)
    this.curPreview=null;      // {mins:Float32Array, maxs:Float32Array, idx:number, remain:number}
    this.samplesPerBucket=1;

    // timing
    this.segDeadline=0; // ms epoch when current segment ends

    // ui
    this.$status = document.getElementById('status');
    this.$diag   = document.getElementById('diag');
    this.$segLen = document.getElementById('segLen');
    this.$buckets= document.getElementById('buckets');
    this.$scope  = document.getElementById('scope');
    this.ctxScope= this.$scope.getContext('2d');
    this.$clips  = document.getElementById('clips');
    this.$start  = document.getElementById('startBtn');
    this.$stop   = document.getElementById('stopBtn');
    this.$csv    = document.getElementById('exportCsvBtn');
    this.$clear  = document.getElementById('clearAllBtn');

    this.bind();
    this.resizeCanvases();
    this.restoreClips();
  }

  bind(){
    this.$start.onclick=()=>this.start();
    this.$stop.onclick =()=>this.stop();
    this.$csv.onclick  =()=>this.exportCSV();
    this.$clear.onclick=async()=>{ if (confirm('Delete all clips?')) { await dbClearAll(); this.renderClips([]); } };
    this.$segLen.onchange=()=>{ this.segmentSec = clamp(int(this.$segLen.value),30,300); this.$segLen.value=this.segmentSec; };
    this.$buckets.onchange=()=>{ this.bucketsPerSeg=clamp(int(this.$buckets.value),200,2000); this.$buckets.value=this.bucketsPerSeg; };
    window.addEventListener('resize', ()=>this.resizeCanvases());
  }

  resizeCanvases(){
    this.$scope.width = this.$scope.clientWidth; this.$scope.height=this.$scope.clientHeight;
    this.ctxScope.fillStyle='#000'; this.ctxScope.fillRect(0,0,this.$scope.width,this.$scope.height);
  }

  async restoreClips(){
    const rows = await dbGetClips();
    this.renderClips(rows);
  }

  updateStatus(rec){
    this.$status.textContent = rec ? 'Status: Recording…' : 'Status: Stopped';
    this.$start.classList.toggle('disabled', rec);
    this.$stop.classList.toggle('disabled', !rec);
  }

  async start(){
    if (!navigator.mediaDevices?.getUserMedia) { alert('getUserMedia not available'); return; }
    const isLocalhost = ['localhost','127.0.0.1','::1'].includes(location.hostname);
    if (!isLocalhost && !window.isSecureContext){ alert('Needs HTTPS or localhost'); return; }
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({audio:true});

      // MediaRecorder (compressed segments)
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
      this.recorder = new MediaRecorder(this.stream, { mimeType: mime, audioBitsPerSecond: 64000 });
      this.recChunks = [];
      this.recorder.ondataavailable = (e)=>{ if (e.data && e.data.size) this.recChunks.push(e.data); };
      this.recorder.onstop = ()=> this.finalizeSegmentBlob();
      this.startNewSegmentRecorder();

      // WebAudio for live scope + preview building
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ac = new AC(); if (this.ac.state==='suspended') await this.ac.resume();
      this.sampleRate = this.ac.sampleRate;
      this.source = this.ac.createMediaStreamSource(this.stream);
      this.analyser = this.ac.createAnalyser(); this.analyser.fftSize=2048; this.analyser.smoothingTimeConstant=0.25;
      this.proc = this.ac.createScriptProcessor(2048,1,1);
      this.proc.onaudioprocess = (e)=>this.onAudio(e);
      this.mute=this.ac.createGain(); this.mute.gain.value=0;

      this.source.connect(this.analyser);
      this.source.connect(this.proc);
      this.proc.connect(this.mute); this.mute.connect(this.ac.destination);

      // init preview bucket sizing for current segment
      this.initPreview();

      this.updateStatus(true);
      this.animateScope();
      this.$diag.textContent = `SR=${this.sampleRate}Hz · MIME=${mime}`;
    } catch (err) {
      console.error(err);
      alert(`Failed to start:\n${err.name}: ${err.message}`);
    }
  }

  startNewSegmentRecorder(){
    // kick a fresh segment and set deadline
    this.recChunks = [];
    this.recorder.start(); // not using timeslice; we stop manually by deadline → better sync with preview
    this.segDeadline = performance.now() + this.segmentSec*1000;
    // arm timer for exact stop
    this.segTimer?.cancel && this.segTimer.cancel();
    this.segTimer = schedule(()=> this.rotateSegment(), this.segmentSec*1000);
  }

  rotateSegment(){
    if (this.recorder && this.recorder.state === 'recording') {
      this.recorder.stop(); // will call finalizeSegmentBlob()
    }
  }

  finalizeSegmentBlob(){
    const blob = new Blob(this.recChunks, { type: this.recorder.mimeType || 'audio/webm' });
    const ts   = Date.now();
    const preview = this.packPreview(); // {mins,maxs,width}
    const meta = {
      ts, durSec: this.segmentSec, mime: blob.type,
      previewWidth: preview.mins.length, // = bucketsPerSeg
      createdAt: new Date(ts).toISOString()
    };
    // persist
    dbAddClip({ ts, blob, preview, meta }).then((id)=>{
      // update UI immediately (need ObjectURL)
      const url = URL.createObjectURL(blob);
      const row = { id, ts, blob, preview, meta, _url:url };
      this.prependClipRow(row);
    }).catch(e=>console.warn('db add failed', e));

    // immediately begin next segment
    this.initPreview(); // reset preview accumulators
    if (this.recorder?.state !== 'recording') this.startNewSegmentRecorder();
  }

  initPreview(){
    this.samplesPerBucket = Math.max(1, Math.floor(this.sampleRate * this.segmentSec / this.bucketsPerSeg));
    this.curPreview = {
      mins: new Float32Array(this.bucketsPerSeg).fill( 1),
      maxs: new Float32Array(this.bucketsPerSeg).fill(-1),
      idx: 0,
      remain: this.samplesPerBucket
    };
  }

  onAudio(e){
    const ch = e.inputBuffer.getChannelData(0);
    // feed preview buckets
    let i=0;
    while (i < ch.length && this.curPreview.idx < this.bucketsPerSeg){
      let take = Math.min(this.curPreview.remain, ch.length - i);
      // scan chunk for min/max
      let mn =  1, mx = -1;
      for (let k=0;k<take;k++){
        const s = ch[i+k];
        if (s<mn) mn=s; if (s>mx) mx=s;
      }
      // merge to current bucket
      const idx=this.curPreview.idx;
      if (mn < this.curPreview.mins[idx]) this.curPreview.mins[idx] = mn;
      if (mx > this.curPreview.maxs[idx]) this.curPreview.maxs[idx] = mx;

      this.curPreview.remain -= take;
      i += take;

      if (this.curPreview.remain === 0){
        // advance bucket
        this.curPreview.idx++;
        this.curPreview.remain = this.samplesPerBucket;
      }
    }
    // rotate by deadline (failsafe in case timer throttled)
    if (performance.now() >= this.segDeadline) this.rotateSegment();
  }

  packPreview(){
    // ensures full arrays; if not filled – pad trailing buckets with zeros
    const {mins,maxs,idx} = this.curPreview;
    if (idx < mins.length){
      for (let j=idx;j<mins.length;j++){ mins[j]=0; maxs[j]=0; }
    }
    return { mins: mins, maxs: maxs }; // Float32Arrays – נשמרים ישירות ב־IDB
  }

  async stop(){
    // stop timers/recorder
    this.segTimer?.cancel && this.segTimer.cancel();
    if (this.recorder && this.recorder.state==='recording'){
      // stop → finalize current segment, then stop audio
      const onStopOnce = () => {
        this.recorder.removeEventListener('stop', onStopOnce);
        this.stopAudioGraph();
      };
      this.recorder.addEventListener('stop', onStopOnce);
      this.recorder.stop();
    } else {
      this.stopAudioGraph();
    }
    this.updateStatus(false);
  }

  stopAudioGraph(){
    try{ this.stream?.getTracks().forEach(t=>t.stop()); }catch{}
    try{ this.ac?.close(); }catch{}
  }

  /* ===== UI: clips ===== */
  async renderClips(rows){
    if (!rows || rows.length===0){
      this.$clips.innerHTML = '<li class="empty">No clips yet</li>';
      return;
    }
    this.$clips.innerHTML = '';
    for (const r of rows){
      // recreate URL for restored rows
      if (!r._url && r.blob) r._url = URL.createObjectURL(r.blob);
      this.$clips.appendChild(this.makeClipRow(r));
    }
  }

  prependClipRow(r){
    if (!r._url) r._url = URL.createObjectURL(r.blob);
    const li = this.makeClipRow(r);
    if (this.$clips.firstChild && !this.$clips.firstChild.classList.contains('empty')){
      this.$clips.insertBefore(li, this.$clips.firstChild);
    } else {
      this.$clips.innerHTML = ''; this.$clips.appendChild(li);
    }
  }

  makeClipRow(r){
    const li = document.createElement('li'); li.className='clip';
    const left = document.createElement('div');
    // canvas thumb
    const canvas = document.createElement('canvas'); canvas.className='thumb';
    canvas.width = canvas.clientWidth || 600; canvas.height = canvas.clientHeight || 60;
    this.drawPreview(canvas.getContext('2d'), canvas.width, canvas.height, r.preview);
    const meta = document.createElement('div'); meta.className='meta';
    meta.textContent = `${new Date(r.ts).toLocaleString()} · ${Math.round(r.meta?.durSec||this.segmentSec)}s · ${r.meta?.mime || r.blob?.type || ''}`;
    left.appendChild(canvas); left.appendChild(meta);

    const right = document.createElement('div'); right.className='right';
    const audio = document.createElement('audio'); audio.controls=true; audio.src = r._url;
    const dl = document.createElement('a'); dl.href=r._url; dl.download = `clip_${r.ts}.webm`; dl.textContent='Download';
    right.appendChild(audio); right.appendChild(dl);

    li.appendChild(left); li.appendChild(right);
    return li;
  }

  drawPreview(ctx,w,h,preview){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
    if (!preview){ ctx.fillStyle='#888'; ctx.fillText('no preview',6,14); return; }
    const mins=preview.mins, maxs=preview.maxs, n=mins.length;
    if (!n){ ctx.fillStyle='#888'; ctx.fillText('empty',6,14); return; }
    ctx.strokeStyle='#0f0'; ctx.lineWidth=1;
    const dx = w / n;
    ctx.beginPath();
    for (let i=0;i<n;i++){
      const x = i*dx + dx/2;
      const y1 = (1 - ((maxs[i]+1)/2)) * h;
      const y2 = (1 - ((mins[i]+1)/2)) * h;
      ctx.moveTo(x,y1); ctx.lineTo(x,y2);
    }
    ctx.stroke();
  }

  exportCSV(){
    // meta only (one row per clip)
    const rows = [...this.$clips.querySelectorAll('.clip')];
    if (rows.length===0){ alert('No clips'); return; }
    // better: read from DB
    dbGetClips().then(list=>{
      const csv = 'timestamp_iso,duration_sec,mime,buckets\n' +
        list.map(r=>`${new Date(r.ts).toISOString()},${Math.round(r.meta?.durSec||this.segmentSec)},${(r.meta?.mime||'')},${(r.preview?.mins?.length||0)}`).join('\n');
      const blob = new Blob([csv],{type:'text/csv'});
      const url=URL.createObjectURL(blob); const a=document.createElement('a');
      a.href=url; a.download='noise_segments.csv'; a.click(); URL.revokeObjectURL(url);
    });
  }

  /* ===== live oscilloscope (short) ===== */
  animateScope(prev=0){
    if (!this.analyser) return;
    requestAnimationFrame((ts)=>{
      if (ts - prev >= 1000/24){
        const data = new Uint8Array(this.analyser.frequencyBinCount);
        this.analyser.getByteTimeDomainData(data);
        const w=this.$scope.width,h=this.$scope.height, ctx=this.ctxScope;
        ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
        ctx.beginPath(); ctx.strokeStyle='#0f0'; ctx.lineWidth=2;
        const dx = w/data.length; let x=0;
        for(let i=0;i<data.length;i++){
          const y = (data[i]/128.0) * h/2;
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); x+=dx;
        }
        ctx.stroke();
      }
      this.animateScope(ts);
    });
  }
}

/* ===== utils ===== */
const int = (v)=>parseInt(v,10)||0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const schedule=(fn,ms)=>{ const id=setTimeout(fn,ms); return {cancel:()=>clearTimeout(id)}; };

/* init */
window.addEventListener('load', ()=> new SegmentRecorder());
</script>
</body>
</html>
